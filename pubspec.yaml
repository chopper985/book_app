name: interview_practice
description: "Interview Practice"
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^2.0.0
  cupertino_ui: ^1.1.7
  material_ui: ^1.11.1

  # State management
  flutter_bloc: ^9.1.1
  bloc_concurrency: ^0.3.0

  # Dependency Injection
  get_it: ^9.3.0
  injectable: ^3.0.0

  # Storage
  hive_ce: ^2.24.0
  path_provider: ^2.1.6
  flutter_secure_storage: ^11.2.0

  # Network
  dio: ^5.11.1
  dio_smart_retry: ^7.0.1
  http_parser: ^4.1.2

  # Media
  image_picker: ^1.2.4

  # Utils
  flutter_localizations:
    sdk: flutter
  flutter_native_splash: ^2.4.8
  intl: ^0.20.3
  i18n_extension: ^16.0.3
  permission_handler: ^13.0.2
  cached_network_image: ^4.0.7
  sizer: ^3.1.3
  pull_to_refresh: ^2.0.0
  super_sliver_list: ^0.4.1
  toastification: ^3.2.2
  flutter_svg: ^2.5.0

  # Helper
  collection: ^1.19.1
  share_plus: ^13.3.1
  equatable: ^3.0.0

  # Go router
  go_router: ^18.1.4

  # Firebase
  firebase_core: ^5.2.0
  firebase_analytics: ^13.1.0
  firebase_crashlytics: ^6.1.0
  firebase_auth: ^7.1.0
  google_sign_in: ^7.2.0
  cloud_firestore: ^7.2.0

  # Facebook
  flutter_facebook_auth: ^7.3.3
  app_tracking_transparency: ^2.0.7

  crypto: ^3.0.8
  purchases_flutter: ^11.0.4

dev_dependencies:
  # Test
  flutter_test:
    sdk: flutter
  mockito: ^5.8.1

  # Config app
  flutter_launcher_icons: ^0.14.4
  package_rename: ^1.10.1

  # Code Generator
  injectable_generator: ^3.1.3
  build_runner: ^2.16.1
  flutter_gen_runner: ^5.15.0
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  go_router_builder: ^4.5.3

  # Lints
  import_sorter: ^4.6.0
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/content/
    - assets/content/dart/
    - assets/content/flutter/
    - assets/content/react_ts/
    - assets/content/react_native/
    - assets/content/javascript/
    - assets/content/nodejs/
    - assets/content/php/
    - assets/content/java/
    - assets/content/dotnet/
    - assets/content/swift/
    - assets/content/go/
    - assets/content/rust/
    - assets/content/kotlin/
    - assets/content/typescript/
    - assets/content/python/
    - assets/content/sql/
    - assets/content/http_api/
    - assets/content/git/
    - assets/content/testing/
    - assets/content/nextjs/
    - assets/content/vue/
    - assets/content/angular/
    - assets/content/express/
    - assets/content/nestjs/
    - assets/content/realtime/
    - assets/content/firebase/
    - assets/content/maps/
    - assets/content/push/
    - assets/content/aws/
    - assets/content/docker/
    - assets/content/cicd/
    - assets/content/graphql/
    - assets/content/redis/
    - assets/content/message_queue/
    - assets/images/figma/
    - assets/figma/explore/
    - assets/figma/nav/
    - assets/figma/track/
    - assets/figma/practice/
    - assets/figma/result/
    - assets/figma/auth/

  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
    - family: BeVietnamPro
      fonts:
        - asset: assets/fonts/BeVietnamPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BeVietnamPro-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_100.ttf
          weight: 100
        - asset: assets/fonts/Inter_200.ttf
          weight: 200
        - asset: assets/fonts/Inter_300.ttf
          weight: 300
        - asset: assets/fonts/Inter_400.ttf
          weight: 400
        - asset: assets/fonts/Inter_500.ttf
          weight: 500
        - asset: assets/fonts/Inter_600.ttf
          weight: 600
        - asset: assets/fonts/Inter_700.ttf
          weight: 700
        - asset: assets/fonts/Inter_800.ttf
          weight: 800
        - asset: assets/fonts/Inter_900.ttf
          weight: 900
